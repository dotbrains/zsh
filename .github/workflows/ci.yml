name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Validate
        run: |
          chmod +x scripts/validate.sh
          scripts/validate.sh --all
